<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParaSpot</title>
<meta name="description" content="Où et quand gonfler ou voler depuis Rennes : créneaux, modèles AROME HD, ECMWF et GFS, fiches de sites et balises Spot Air.">
<meta name="theme-color" content="#cfe3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081326" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ParaSpot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet 1.9.4 (BSD-2-Clause, © Volodymyr Agafonkin) embarqué pour fonctionner hors-ligne -->
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- COMPOSANT: stage (fond de carte vectoriel + champ de vent + teinte du ciel) -->
<div class="stage" id="stage" aria-hidden="false">
  <div id="map" role="region" aria-label="Carte de la Bretagne et des spots. Pincer pour zoomer."></div>
  <canvas id="wind" aria-hidden="true"></canvas>
  <div class="sky" id="sky" aria-hidden="true"></div>
</div>

<!-- Surcouche d'interface -->
<div class="ui" id="ui">
  <header class="top">
    <div class="top-inner" style="display:grid;gap:14px">
      <!-- COMPOSANT: topbar -->
      <div class="topbar">
        <button type="button" class="logo" data-action="home" aria-label="ParaSpot, revenir à la vue d'ensemble"></button>
        <div class="days glass" id="days" role="group" aria-label="Jour"></div>
        <button type="button" class="icon-btn glass" data-action="open-panel" aria-label="Réglages"></button>
      </div>
      <!-- COMPOSANT: statement -->
      <div class="st-row" id="eyebrow"></div>
      <div id="statement" aria-live="polite"></div>
    </div>
  </header>

  <footer class="dock">
    <div class="dock-row"><div class="dock-inner dock-head">
      <!-- COMPOSANT: kind-filter -->
      <div class="kinds glass" id="kinds" role="group" aria-label="Pratique"></div>
      <button type="button" class="focus-btn glass" id="focus-btn" data-action="unfocus" hidden>Afficher les spots</button>
      <!-- COMPOSANT: map-tools -->
      <span class="tools">
        <button type="button" class="icon-btn glass" data-action="wind" aria-pressed="false" aria-label="Masquer le vent animé"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg></button>
        <button type="button" class="layer-btn glass" data-action="model" aria-label="Modèle de prévision"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><span>AROME HD</span></button>
        <button type="button" class="layer-btn glass" data-action="layer" aria-label="Fond de carte"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Plan</span></button>
      </span>
    </div></div>
    <!-- COMPOSANT: legend (visible en mode carte) -->
    <div class="dock-row legend-row"><div class="dock-inner legend glass" id="legend" aria-label="Légende des marqueurs"></div></div>
    <!-- COMPOSANT: spot-carousel -->
    <div class="carousel" id="carousel" aria-label="Spots, du meilleur au moins bon"></div>
    <!-- COMPOSANT: time-scrubber -->
    <div class="dock-row"><div class="dock-inner scrub" id="scrub"></div></div>
    <div class="dock-row"><p class="dock-inner attrib" id="attrib"></p></div>
  </footer>
</div>

<!-- COMPOSANT: detail -->
<section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1"></section>
<!-- COMPOSANT: panel (réglages + notifications) -->
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" tabindex="-1"></section>
<!-- COMPOSANT: loader -->
<div class="loader" id="loader" aria-hidden="true"><div class="glider"></div><p class="glass">Lecture du ciel</p></div>
<div class="info" id="info" role="status" aria-live="polite"></div>
<!-- COMPOSANT: toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
