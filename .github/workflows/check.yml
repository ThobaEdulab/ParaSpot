name: Alertes vol et gonflage

on:
  schedule:
    # Heures UTC. Été (UTC+2) : 7h05 et 18h35 à Rennes. Hiver (UTC+1) : 6h05 et 17h35.
    - cron: "5 5 * * *"
    - cron: "35 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (aujourd'hui + demain) ou evening (demain)"
        default: "morning"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Calcul des créneaux et notification
        env:
          RUN_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 5 * * *' && 'morning' || 'evening') }}
          APP_URL: ${{ vars.APP_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
        run: node scripts/check.mjs

      # GitHub désactive les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # Un petit commit le 1er et le 15 du mois évite ça.
      - name: Maintien en vie du planning
        if: github.event.schedule == '35 16 * * *'
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ] || [ "$d" = "15" ]; then
            date -u +%FT%TZ > data/heartbeat.txt
            git config user.name "paraspot-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/heartbeat.txt
            git commit -m "heartbeat" && git push || true
          fi
