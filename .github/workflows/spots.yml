name: Mise à jour des spots de France

on:
  schedule:
    # Chaque lundi à 3h12 UTC
    - cron: "12 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import FFVL, ParaglidingEarth et gares SNCF
        run: node scripts/import_spots.mjs
      - name: Enregistrer les fichiers mis à jour
        run: |
          git config user.name "paraspot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/france.json data/gares.json 2>/dev/null || true
          git commit -m "Mise à jour des spots de France et des gares" && git push || echo "Rien de nouveau."
